 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Tyrell Images</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="login-page">

  <div class="login-split">
    <!-- Left: Image Panel -->
    <div class="login-visual">
      <div class="login-visual-bg"></div>
      <div class="login-visual-overlay"></div>
      <div class="login-brand">
        <div class="brand-logo">TI</div>
        <h1>Tyrell Images</h1>
        <p>Your memories, beautifully preserved.</p>
      </div>
    </div>

    <!-- Right: Form Panel -->
    <div class="login-form-panel">
      <div class="login-form-wrap">
        <h2>Welcome Back</h2>
        <p class="login-sub">Sign in to access your dashboard</p>

        <div class="role-toggle">
          <button class="role-btn active" onclick="setRole('client')" id="btn-client">Client</button>
          <button class="role-btn" onclick="setRole('photographer')" id="btn-photographer">Photographer</button>
        </div>

        <div id="error-msg" class="error-msg hidden"></div>

        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter your username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" />
        </div>

        <button class="btn-submit" onclick="handleLogin()">
          <span id="btn-text">Sign In</span>
          <span id="btn-loader" class="hidden">Loading...</span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
  <script src="login.js"></script>

</body>
</html>
