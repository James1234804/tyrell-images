<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Gallery — Tyrell Images</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dashboard-page client-dash">

  <header class="client-header">
    <div class="client-header-brand">
      <div class="brand-logo-sm">TI</div>
      <span>Tyrell Images</span>
    </div>
    <div class="client-header-right">
      <span id="client-welcome">Welcome</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="client-main">
    <div class="client-hero">
      <h1>Your Gallery</h1>
      <p id="photo-count">Loading your photos...</p>
    </div>

    <div class="client-actions-bar">
      <button class="btn-primary" onclick="downloadAll()" id="download-all-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download All Photos
      </button>
      <span id="download-status" class="download-status hidden"></span>
    </div>

    <div id="gallery-grid" class="photos-grid client-grid">
      <p class="empty-state">Loading your photos...</p>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-backdrop" onclick="closeLightbox()"></div>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="" />
      <div class="lightbox-controls">
        <button class="btn-primary" onclick="downloadSingle()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
        <button class="btn-ghost-light" onclick="closeLightbox()">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dashboard.js"></script>
  <script>
    // Auth guard
    const clientId = sessionStorage.getItem('clientId');
    const clientName = sessionStorage.getItem('clientName');
    if (sessionStorage.getItem('role') !== 'client' || !clientId) {
      window.location.href = 'login.html';
    }

    let currentPhotoUrl = '';
    let currentPhotoName = '';
    let allPhotos = [];

    document.getElementById('client-welcome').textContent = `Welcome, ${clientName}`;

    async function loadGallery() {
      const grid = document.getElementById('gallery-grid');
      allPhotos = await getPhotos(clientId);

      if (!allPhotos.length) {
        grid.innerHTML = '<p class="empty-state">No photos uploaded yet. Check back soon!</p>';
        document.getElementById('photo-count').textContent = 'No photos yet';
        document.getElementById('download-all-btn').disabled = true;
        return;
      }

      document.getElementById('photo-count').textContent = `${allPhotos.length} photo${allPhotos.length !== 1 ? 's' : ''} in your gallery`;

      grid.innerHTML = allPhotos.map((p, i) => `
        <div class="photo-card client-photo-card" onclick="openLightbox('${p.file_url}', '${p.file_name}')">
          <div class="photo-img-wrap">
            <img src="${p.file_url}" alt="${p.file_name}" loading="lazy" />
            <div class="photo-hover-overlay">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </div>
          </div>
          <div class="photo-card-info">
            <span>${p.file_name}</span>
            <button class="btn-download-sm" onclick="event.stopPropagation(); quickDownload('${p.file_url}', '${p.file_name}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function openLightbox(url, name) {
      currentPhotoUrl = url;
      currentPhotoName = name;
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
    }

    async function downloadSingle() {
      await quickDownload(currentPhotoUrl, currentPhotoName);
    }

    async function quickDownload(url, name) {
      const a = document.createElement('a');
      const res = await fetch(url);
      const blob = await res.blob();
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    }

    async function downloadAll() {
      if (!allPhotos.length) return;
      const status = document.getElementById('download-status');
      const btn = document.getElementById('download-all-btn');
      btn.disabled = true;
      status.textContent = 'Preparing download...';
      status.classList.remove('hidden');

      // Download one by one with delay
      for (let i = 0; i < allPhotos.length; i++) {
        status.textContent = `Downloading ${i + 1}/${allPhotos.length}...`;
        await quickDownload(allPhotos[i].file_url, allPhotos[i].file_name);
        await new Promise(r => setTimeout(r, 800));
      }

      status.textContent = `All ${allPhotos.length} photos downloaded!`;
      btn.disabled = false;
      setTimeout(() => status.classList.add('hidden'), 4000);
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = 'login.html';
    }

    // Close lightbox on escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    loadGallery();
  </script>
</body>
</html>
