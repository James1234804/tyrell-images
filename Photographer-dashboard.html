 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photographer Dashboard — Tyrell Images</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dashboard-page">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo-sm">TI</div>
      <span>Tyrell Images</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" onclick="showTab('clients')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clients
      </a>
      <a href="#" class="nav-item" onclick="showTab('upload')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        Upload Photos
      </a>
      <a href="#" class="nav-item" onclick="showTab('gallery')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        All Photos
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="dash-main">
    <header class="dash-header">
      <div>
        <h2 id="tab-title">Clients</h2>
        <p class="dash-sub">Manage your clients and their photo galleries</p>
      </div>
    </header>

    <!-- CLIENTS TAB -->
    <div id="tab-clients" class="tab-content active">
      <div class="card">
        <div class="card-header">
          <h3>Add New Client</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Client Name</label>
            <input type="text" id="client-name" placeholder="e.g. John & Sarah Wedding" />
          </div>
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="client-username" placeholder="e.g. johnsarah2024" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="client-password" placeholder="Set their password" />
          </div>
          <div class="form-group" style="justify-content:flex-end; padding-top:1.5rem;">
            <button class="btn-primary" onclick="createNewClient()">Create Client</button>
          </div>
        </div>
        <div id="client-msg" class="msg hidden"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>All Clients</h3>
          <button class="btn-ghost" onclick="loadClients()">Refresh</button>
        </div>
        <div id="clients-list" class="clients-list">
          <p class="empty-state">Loading clients...</p>
        </div>
      </div>
    </div>

    <!-- UPLOAD TAB -->
    <div id="tab-upload" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h3>Upload Photos</h3>
        </div>
        <div class="form-group">
          <label>Select Client</label>
          <select id="upload-client-select">
            <option value="">Loading clients...</option>
          </select>
        </div>
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('photo-files').click()">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
          <p>Click to select photos</p>
          <span>JPG, PNG, WEBP — multiple files allowed</span>
          <input type="file" id="photo-files" multiple accept="image/*" style="display:none" onchange="handleFileSelect()" />
        </div>
        <div id="file-preview" class="file-preview hidden"></div>
        <div id="upload-progress" class="upload-progress hidden">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="progress-text">Uploading...</span>
        </div>
        <button class="btn-primary" onclick="uploadPhotos()" style="margin-top:1rem;">Upload Photos</button>
        <div id="upload-msg" class="msg hidden"></div>
      </div>
    </div>

    <!-- GALLERY TAB -->
    <div id="tab-gallery" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h3>All Photos</h3>
          <div style="display:flex; gap:1rem; align-items:center;">
            <select id="gallery-client-filter" onchange="loadAllPhotos()">
              <option value="">All Clients</option>
            </select>
            <button class="btn-ghost" onclick="loadAllPhotos()">Refresh</button>
          </div>
        </div>
        <div id="all-photos-grid" class="photos-grid">
          <p class="empty-state">Loading photos...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="" />
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dashboard.js"></script>
  <script>
    // Auth guard
    if (sessionStorage.getItem('role') !== 'photographer') {
      window.location.href = 'login.html';
    }

    let selectedFiles = [];

    function showTab(tab) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.currentTarget.classList.add('active');
      const titles = { clients: 'Clients', upload: 'Upload Photos', gallery: 'All Photos' };
      document.getElementById('tab-title').textContent = titles[tab];
      if (tab === 'gallery') loadAllPhotos();
    }

    async function createNewClient() {
      const name = document.getElementById('client-name').value.trim();
      const username = document.getElementById('client-username').value.trim();
      const password = document.getElementById('client-password').value.trim();
      const msg = document.getElementById('client-msg');

      if (!name || !username || !password) {
        showMsg('client-msg', 'Please fill in all fields.', 'error');
        return;
      }

      const result = await addClient(name, username, password);
      if (result.success) {
        showMsg('client-msg', `Client "${name}" created successfully!`, 'success');
        document.getElementById('client-name').value = '';
        document.getElementById('client-username').value = '';
        document.getElementById('client-password').value = '';
        loadClients();
        loadClientSelects();
      } else {
        showMsg('client-msg', result.error || 'Failed to create client.', 'error');
      }
    }

    async function loadClients() {
      const list = document.getElementById('clients-list');
      const clients = await getClients();
      if (!clients.length) {
        list.innerHTML = '<p class="empty-state">No clients yet. Add your first client above!</p>';
        return;
      }
      list.innerHTML = clients.map(c => `
        <div class="client-row">
          <div class="client-avatar">${c.name.charAt(0).toUpperCase()}</div>
          <div class="client-info">
            <strong>${c.name}</strong>
            <span>@${c.username}</span>
          </div>
          <div class="client-actions">
            <button class="btn-ghost" onclick="viewClientPhotos('${c.id}', '${c.name}')">View Photos</button>
            <button class="btn-danger" onclick="deleteClient('${c.id}', '${c.name}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function loadClientSelects() {
      const clients = await getClients();
      const opts = clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('upload-client-select').innerHTML = '<option value="">Select a client...</option>' + opts;
      document.getElementById('gallery-client-filter').innerHTML = '<option value="">All Clients</option>' + opts;
    }

    function handleFileSelect() {
      selectedFiles = Array.from(document.getElementById('photo-files').files);
      const preview = document.getElementById('file-preview');
      if (!selectedFiles.length) { preview.classList.add('hidden'); return; }
      preview.classList.remove('hidden');
      preview.innerHTML = selectedFiles.map(f => `
        <div class="preview-item">
          <img src="${URL.createObjectURL(f)}" alt="${f.name}" />
          <span>${f.name}</span>
        </div>
      `).join('');
    }

    async function uploadPhotos() {
      const clientId = document.getElementById('upload-client-select').value;
      if (!clientId) { showMsg('upload-msg', 'Please select a client.', 'error'); return; }
      if (!selectedFiles.length) { showMsg('upload-msg', 'Please select photos to upload.', 'error'); return; }

      const progress = document.getElementById('upload-progress');
      const fill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');
      progress.classList.remove('hidden');

      let uploaded = 0;
      for (const file of selectedFiles) {
        const result = await uploadPhoto(clientId, file);
        if (!result.success) {
          showMsg('upload-msg', `Failed to upload ${file.name}: ${result.error}`, 'error');
        }
        uploaded++;
        const pct = Math.round((uploaded / selectedFiles.length) * 100);
        fill.style.width = pct + '%';
        progressText.textContent = `Uploading ${uploaded}/${selectedFiles.length}...`;
      }

      progress.classList.add('hidden');
      fill.style.width = '0%';
      selectedFiles = [];
      document.getElementById('photo-files').value = '';
      document.getElementById('file-preview').classList.add('hidden');
      showMsg('upload-msg', `${uploaded} photo(s) uploaded successfully!`, 'success');
    }

    async function loadAllPhotos() {
      const grid = document.getElementById('all-photos-grid');
      const clientId = document.getElementById('gallery-client-filter').value;
      grid.innerHTML = '<p class="empty-state">Loading...</p>';
      const photos = await getPhotos(clientId || null);
      if (!photos.length) {
        grid.innerHTML = '<p class="empty-state">No photos found.</p>';
        return;
      }
      grid.innerHTML = photos.map(p => `
        <div class="photo-card">
          <img src="${p.file_url}" alt="${p.file_name}" onclick="openLightbox('${p.file_url}')" />
          <div class="photo-card-info">
            <span>${p.file_name}</span>
            <button class="btn-danger-sm" onclick="deletePhoto('${p.id}', '${p.file_name}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function viewClientPhotos(clientId, name) {
      showTab('gallery');
      document.getElementById('gallery-client-filter').value = clientId;
      loadAllPhotos();
    }

    async function deleteClient(id, name) {
      if (!confirm(`Delete client "${name}" and all their photos?`)) return;
      const result = await removeClient(id);
      if (result.success) { loadClients(); loadClientSelects(); }
      else alert('Failed to delete: ' + result.error);
    }

    async function deletePhoto(id, name) {
      if (!confirm(`Delete photo "${name}"?`)) return;
      const result = await removePhoto(id);
      if (result.success) loadAllPhotos();
      else alert('Failed to delete: ' + result.error);
    }

    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + type;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = 'login.html';
    }

    // Init
    loadClients();
    loadClientSelects();
  </script>
</body>
</html>
