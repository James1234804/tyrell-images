 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Gallery — Tyrell Images</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dashboard-page client-dash">

  <!-- Header -->
  <header class="client-header">
    <div class="client-header-brand">
      <div class="brand-logo-sm">TI</div>
      <span>Tyrell Images</span>
    </div>
    <div class="client-header-right">
      <span id="client-welcome">Welcome</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="client-main">
    <!-- Hero / Stats -->
    <div class="client-hero">
      <h1>Your Gallery</h1>
      <div class="gallery-stats hidden" id="gallery-stats">
        <div class="stat-item">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">Photos</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value" id="stat-favs">0</span>
          <span class="stat-label">Favourites</span>
        </div>
      </div>
      <p id="photo-count">Loading your photos...</p>
    </div>

    <!-- Actions bar -->
    <div class="client-actions-bar">
      <button class="btn-primary" onclick="downloadAll()" id="download-all-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download All
      </button>
      <button class="btn-select-mode" id="select-mode-btn" onclick="toggleSelectMode()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="1"/>
          <polyline points="9 11 12 14 22 4"/>
        </svg>
        Select
      </button>
      <button class="btn-download-selected hidden" id="download-selected-btn" onclick="downloadSelected()" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download Selected (<span id="sel-count">0</span>)
      </button>
    </div>

    <!-- Filter tabs -->
    <div class="gallery-filters hidden" id="gallery-filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All Photos</button>
      <button class="filter-btn" onclick="setFilter('favs', this)">&#9829; Favourites</button>
    </div>

    <!-- Gallery -->
    <div id="gallery-grid" class="photos-grid client-grid">
      <div class="skeleton-grid" id="skeleton-loader">
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div>
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>
    <div class="lightbox-inner">
      <button class="lightbox-nav" id="lb-prev" onclick="lightboxNav(-1)">&#8592;</button>
      <div class="lightbox-img-wrap">
        <img id="lightbox-img" src="" alt="" />
      </div>
      <button class="lightbox-nav" id="lb-next" onclick="lightboxNav(1)">&#8594;</button>
    </div>
    <div class="lightbox-meta">
      <span class="lightbox-filename" id="lb-filename"></span>
      <span class="lightbox-counter" id="lb-counter"></span>
    </div>
    <div class="lightbox-actions">
      <button class="btn-primary" onclick="downloadSingle()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download
      </button>
      <button class="btn-ghost-light" onclick="closeLightbox()">Close</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
  <script src="client-dashboard.js"></script>
</body>
</html>
